<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>采购待办</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      background: #f5f5f5; 
      min-height: 100vh;
      padding-bottom: 20px;
    }
    
    .stats { 
      display: flex; 
      justify-content: center;
      gap: 30px;
      padding: 12px 15px; 
      background: white; 
      border-bottom: 1px solid #eee;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .stat { text-align: center; }
    .stat-num { font-size: 22px; font-weight: 700; }
    .stat-num.pending { color: #ea4335; }
    .stat-num.done { color: #34a853; }
    .stat-label { font-size: 11px; color: #888; }
    
    .tabs { 
      display: flex; 
      padding: 8px 10px; 
      gap: 6px; 
      background: #f5f5f5;
      position: sticky;
      top: 52px;
      z-index: 99;
    }
    .tab { 
      flex: 1; 
      padding: 8px 6px; 
      border: none; 
      border-radius: 20px; 
      background: white; 
      cursor: pointer; 
      font-size: 13px;
      font-weight: 500;
      color: #666;
    }
    .tab.active { background: #4285f4; color: white; }
    
    .list { padding: 0 10px; }
    
    .item { 
      background: white; 
      margin: 6px 0; 
      padding: 10px 12px; 
      border-radius: 10px; 
      display: flex; 
      align-items: center; 
      gap: 10px;
    }
    
    .checkbox { 
      width: 26px; 
      height: 26px; 
      border: 2px solid #ddd; 
      border-radius: 50%; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 14px; 
      flex-shrink: 0;
      cursor: pointer;
    }
    .checkbox:active { transform: scale(0.9); }
    .checkbox.pending { border-color: #ea4335; }
    .checkbox.done { border-color: #34a853; background: #34a853; color: white; }
    
    .item-content { flex: 1; min-width: 0; }
    .item-name { 
      font-size: 14px; 
      color: #333;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-spec {
      color: #999;
      margin-left: 6px;
    }
    .item.done .item-name { color: #bbb; text-decoration: line-through; }
    
    .item-progress {
      font-size: 11px;
      color: #888;
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .progress-bar {
      flex: 1;
      height: 3px;
      background: #eee;
      border-radius: 2px;
      overflow: hidden;
      max-width: 80px;
    }
    .progress-fill {
      height: 100%;
      background: #34a853;
    }
    
    .item-qty-section {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    
    .item-total { 
      background: #f0f0f0; 
      color: #666; 
      padding: 4px 8px; 
      border-radius: 12px; 
      font-size: 12px; 
      white-space: nowrap;
    }
    .item.done .item-total { color: #bbb; }
    
    .item-purchased {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 12px;
      cursor: pointer;
      border: none;
    }
    .item-purchased:active { background: #c8e6c9; }
    
    .empty { 
      text-align: center; 
      padding: 40px 20px; 
      color: #999; 
    }
    .empty-icon { font-size: 40px; margin-bottom: 10px; }
    
    .loading-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }
    .loading-overlay.hidden { display: none; }
    .loading-spinner { font-size: 30px; animation: spin 1s linear infinite; }
    
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    /* 弹窗 */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
      z-index: 300;
    }
    .modal.show { display: flex; }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 14px;
      width: 280px;
      text-align: center;
    }
    .modal-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .modal-subtitle {
      font-size: 13px;
      color: #888;
      margin-bottom: 15px;
    }
    .modal-input {
      width: 100%;
      padding: 12px;
      font-size: 20px;
      text-align: center;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      margin-bottom: 15px;
      outline: none;
    }
    .modal-input:focus { border-color: #4285f4; }
    .modal-buttons { display: flex; gap: 10px; }
    .modal-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
    }
    .modal-btn.cancel { background: #f0f0f0; color: #666; }
    .modal-btn.confirm { background: #4285f4; color: white; }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner">🔄</div>
  </div>
  
  <div class="stats">
    <div class="stat">
      <div class="stat-num pending" id="statPending">-</div>
      <div class="stat-label">待采购</div>
    </div>
    <div class="stat">
      <div class="stat-num done" id="statDone">-</div>
      <div class="stat-label">已采购</div>
    </div>
  </div>
  
  <div class="tabs">
    <button class="tab active" data-filter="pending">待采购</button>
    <button class="tab" data-filter="done">已采购</button>
    <button class="tab" data-filter="all">全部</button>
  </div>
  
  <div class="list" id="list"></div>

  <div class="modal" id="editModal">
    <div class="modal-content">
      <div class="modal-title" id="modalTitle">编辑已采购</div>
      <div class="modal-subtitle" id="modalSubtitle">需采购: 10 个</div>
      <input type="number" class="modal-input" id="modalInput" min="0">
      <div class="modal-buttons">
        <button class="modal-btn cancel" onclick="closeModal()">取消</button>
        <button class="modal-btn confirm" onclick="confirmEdit()">确认</button>
      </div>
    </div>
  </div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwtCtorZNliBw8DrtEhFZS7_qnOgf6IlgqgFt9XKIu1SFwovgqXPJletC2cw6ZsGf4jBw/exec';

let allItems = [];
let currentFilter = 'pending';
let editingItem = null;

// Tab 切换
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentFilter = tab.dataset.filter;
    renderList();
  });
});

// 页面可见时自动刷新
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    loadData();
  }
});

// 页面获得焦点时自动刷新
window.addEventListener('focus', () => {
  loadData();
});

// 加载数据
async function loadData() {
  try {
    const response = await fetch(`${API_URL}?action=list`);
    const result = await response.json();
    
    if (result.success) {
      allItems = (result.items || []).map(item => ({
        ...item,
        purchased: item.purchased || 0
      }));
      updateStats();
      renderList();
    }
  } catch (error) {
    console.error(error);
  } finally {
    document.getElementById('loadingOverlay').classList.add('hidden');
  }
}

function updateStats() {
  const pending = allItems.filter(i => i.status !== '已完成' && i.status !== '已采购').length;
  const done = allItems.filter(i => i.status === '已完成' || i.status === '已采购').length;
  document.getElementById('statPending').textContent = pending;
  document.getElementById('statDone').textContent = done;
}

function renderList() {
  let items = allItems;
  
  if (currentFilter === 'pending') {
    items = allItems.filter(i => i.status !== '已完成' && i.status !== '已采购');
  } else if (currentFilter === 'done') {
    items = allItems.filter(i => i.status === '已完成' || i.status === '已采购');
  }
  
  if (!items.length) {
    const messages = {
      'pending': '全部采购完成！🎉',
      'done': '还没有已采购的项目',
      'all': '还没有任何采购项目'
    };
    document.getElementById('list').innerHTML = `
      <div class="empty">
        <div class="empty-icon">📋</div>
        <p>${messages[currentFilter]}</p>
      </div>
    `;
    return;
  }
  
  document.getElementById('list').innerHTML = items.map(item => {
    const isDone = item.status === '已完成' || item.status === '已采购';
    const statusClass = isDone ? 'done' : 'pending';
    const itemClass = isDone ? 'item done' : 'item';
    const icon = isDone ? '✓' : '';
    const purchased = parseInt(item.purchased) || 0;
    const total = parseInt(item.quantity) || 0;
    const percent = total > 0 ? Math.min((purchased / total) * 100, 100) : 0;
    
    let progressHtml = '';
    if (!isDone && purchased > 0 && total > 0) {
      progressHtml = `
        <div class="item-progress">
          ${purchased}/${total}
          <div class="progress-bar"><div class="progress-fill" style="width:${percent}%"></div></div>
        </div>
      `;
    }
    
    return `
      <div class="${itemClass}">
        <div class="checkbox ${statusClass}" onclick="toggleStatus('${item.id}', ${isDone})">${icon}</div>
        <div class="item-content">
          <div class="item-name">${item.name || '-'}<span class="item-spec">${item.spec || ''}</span></div>
          ${progressHtml}
        </div>
        <div class="item-qty-section">
          <div class="item-total">${total}${item.unit || ''}</div>
          ${!isDone ? `<button class="item-purchased" onclick="openEditModal('${item.id}')">${purchased > 0 ? purchased + '已采' : '+采购'}</button>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

async function toggleStatus(id, currentlyDone) {
  const newStatus = currentlyDone ? '待采购' : '已完成';
  const item = allItems.find(i => String(i.id) === String(id));
  if (item) {
    item.status = newStatus;
    if (newStatus === '已完成') item.purchased = item.quantity;
    updateStats();
    renderList();
  }
  
  try {
    await fetch(`${API_URL}?action=update&id=${encodeURIComponent(id)}&status=${encodeURIComponent(newStatus)}&purchased=${item?.purchased || 0}`);
  } catch (error) {
    loadData();
  }
}

function openEditModal(id) {
  editingItem = allItems.find(i => String(i.id) === String(id));
  if (!editingItem) return;
  
  document.getElementById('modalTitle').textContent = editingItem.name;
  document.getElementById('modalSubtitle').textContent = `需采购: ${editingItem.quantity} ${editingItem.unit || ''}`;
  document.getElementById('modalInput').value = editingItem.purchased || 0;
  document.getElementById('modalInput').max = editingItem.quantity;
  document.getElementById('editModal').classList.add('show');
  
  setTimeout(() => {
    const input = document.getElementById('modalInput');
    input.focus();
    input.select();
  }, 100);
}

function closeModal() {
  document.getElementById('editModal').classList.remove('show');
  editingItem = null;
}

document.getElementById('editModal').addEventListener('click', (e) => {
  if (e.target.id === 'editModal') closeModal();
});

async function confirmEdit() {
  if (!editingItem) return;
  
  let purchased = parseInt(document.getElementById('modalInput').value) || 0;
  const total = parseInt(editingItem.quantity) || 0;
  
  if (purchased < 0) purchased = 0;
  if (purchased > total) purchased = total;
  
  editingItem.purchased = purchased;
  closeModal();
  renderList();
  
  try {
    await fetch(`${API_URL}?action=update&id=${encodeURIComponent(editingItem.id)}&purchased=${purchased}`);
  } catch (error) {
    console.error(error);
  }
}

// 初始加载
loadData();

// 每30秒自动刷新
setInterval(loadData, 30000);
</script>
</body>
</html>
