<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>采购待办</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      background: #f0f2f5; 
      min-height: 100vh;
      padding-bottom: 80px;
    }
    
    .header { 
      background: linear-gradient(135deg, #4285f4, #34a853); 
      color: white; 
      padding: 25px 20px; 
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header h1 { font-size: 22px; font-weight: 600; }
    .header p { font-size: 12px; opacity: 0.9; margin-top: 5px; }
    
    .stats { 
      display: flex; 
      justify-content: space-around; 
      padding: 20px 15px; 
      background: white; 
      margin: 12px; 
      border-radius: 16px; 
      box-shadow: 0 2px 12px rgba(0,0,0,0.08); 
    }
    .stat { text-align: center; flex: 1; }
    .stat-num { font-size: 32px; font-weight: 700; }
    .stat-num.pending { color: #ea4335; }
    .stat-num.done { color: #34a853; }
    .stat-label { font-size: 13px; color: #666; margin-top: 4px; }
    
    .tabs { 
      display: flex; 
      padding: 8px 12px; 
      gap: 8px; 
      position: sticky;
      top: 76px;
      background: #f0f2f5;
      z-index: 99;
    }
    .tab { 
      flex: 1; 
      padding: 12px 8px; 
      border: none; 
      border-radius: 25px; 
      background: white; 
      cursor: pointer; 
      font-size: 14px;
      font-weight: 500;
      color: #666;
      transition: all 0.2s;
    }
    .tab.active { background: #4285f4; color: white; }
    .tab:active { transform: scale(0.96); }
    
    .list { padding: 5px 12px; }
    
    .item { 
      background: white; 
      margin: 10px 0; 
      padding: 16px; 
      border-radius: 16px; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); 
      display: flex; 
      align-items: center; 
      gap: 14px;
    }
    
    .checkbox { 
      width: 32px; 
      height: 32px; 
      border: 2.5px solid #e0e0e0; 
      border-radius: 50%; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 16px; 
      flex-shrink: 0;
      transition: all 0.2s;
      cursor: pointer;
    }
    .checkbox:active { transform: scale(0.9); }
    .checkbox.pending { border-color: #ea4335; background: #fff; }
    .checkbox.done { border-color: #34a853; background: #34a853; color: white; }
    
    .item-content { flex: 1; min-width: 0; }
    .item-name { 
      font-weight: 600; 
      font-size: 16px; 
      color: #333;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .item-spec {
      font-size: 13px;
      color: #888;
      font-weight: 400;
    }
    .item.done .item-name { color: #999; text-decoration: line-through; }
    
    .item-qty-section {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    
    .item-purchased {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 6px 12px;
      border-radius: 15px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .item-purchased:active { transform: scale(0.95); background: #c8e6c9; }
    
    .item-total { 
      background: #e8f0fe; 
      color: #4285f4; 
      padding: 6px 12px; 
      border-radius: 15px; 
      font-weight: 600; 
      font-size: 13px; 
      white-space: nowrap;
    }
    .item.done .item-total { background: #f5f5f5; color: #999; }
    
    .item-progress {
      font-size: 12px;
      color: #666;
      margin-top: 6px;
    }
    .progress-bar {
      height: 4px;
      background: #e0e0e0;
      border-radius: 2px;
      margin-top: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #34a853;
      border-radius: 2px;
      transition: width 0.3s;
    }
    
    .empty { 
      text-align: center; 
      padding: 60px 20px; 
      color: #999; 
    }
    .empty-icon { font-size: 60px; margin-bottom: 15px; }
    .empty p { font-size: 15px; }
    
    .refresh-btn { 
      position: fixed; 
      bottom: 25px; 
      right: 20px; 
      width: 60px; 
      height: 60px; 
      border-radius: 50%; 
      background: #4285f4; 
      color: white; 
      border: none; 
      font-size: 26px; 
      box-shadow: 0 4px 20px rgba(66,133,244,0.4); 
      cursor: pointer;
      transition: all 0.2s;
      z-index: 100;
    }
    .refresh-btn:active { transform: scale(0.9); }
    .refresh-btn.loading { animation: spin 1s linear infinite; }
    
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    .loading-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }
    .loading-overlay.hidden { display: none; }
    .loading-spinner {
      font-size: 40px;
      animation: spin 1s linear infinite;
    }
    
    /* 弹窗样式 */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
      z-index: 300;
    }
    .modal.show { display: flex; }
    .modal-content {
      background: white;
      padding: 24px;
      border-radius: 16px;
      width: 85%;
      max-width: 320px;
      text-align: center;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .modal-subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 20px;
    }
    .modal-input {
      width: 100%;
      padding: 14px;
      font-size: 24px;
      text-align: center;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      margin-bottom: 20px;
      outline: none;
    }
    .modal-input:focus { border-color: #4285f4; }
    .modal-buttons {
      display: flex;
      gap: 12px;
    }
    .modal-btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
    }
    .modal-btn.cancel { background: #f0f0f0; color: #666; }
    .modal-btn.confirm { background: #4285f4; color: white; }
    .modal-btn:active { transform: scale(0.96); }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner">🔄</div>
  </div>

  <div class="header">
    <h1>📦 采购待办清单</h1>
    <p>点击圆圈打勾完成 · 点击数量编辑已采购</p>
  </div>
  
  <div class="stats">
    <div class="stat">
      <div class="stat-num pending" id="statPending">-</div>
      <div class="stat-label">待采购</div>
    </div>
    <div class="stat">
      <div class="stat-num done" id="statDone">-</div>
      <div class="stat-label">已采购</div>
    </div>
  </div>
  
  <div class="tabs">
    <button class="tab active" data-filter="pending">待采购</button>
    <button class="tab" data-filter="done">已采购</button>
    <button class="tab" data-filter="all">全部</button>
  </div>
  
  <div class="list" id="list"></div>
  
  <button class="refresh-btn" id="refreshBtn" onclick="loadData()">🔄</button>

  <!-- 编辑已采购数量弹窗 -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <div class="modal-title" id="modalTitle">编辑已采购数量</div>
      <div class="modal-subtitle" id="modalSubtitle">需采购: 10 个</div>
      <input type="number" class="modal-input" id="modalInput" min="0" placeholder="0">
      <div class="modal-buttons">
        <button class="modal-btn cancel" onclick="closeModal()">取消</button>
        <button class="modal-btn confirm" onclick="confirmEdit()">确认</button>
      </div>
    </div>
  </div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyUEwUgUKwtSnb5IxXzw8TFF0iId_CW262Cigj84m4eSBXWkF8Y4Cc93aSR4J8Ozk_BRA/exec';

let allItems = [];
let currentFilter = 'pending';
let editingItem = null;

// Tab 切换
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentFilter = tab.dataset.filter;
    renderList();
  });
});

// 加载数据
async function loadData() {
  const refreshBtn = document.getElementById('refreshBtn');
  const loadingOverlay = document.getElementById('loadingOverlay');
  
  refreshBtn.classList.add('loading');
  
  try {
    const response = await fetch(`${API_URL}?action=list`);
    const result = await response.json();
    
    if (result.success) {
      allItems = (result.items || []).map(item => ({
        ...item,
        purchased: item.purchased || 0  // 已采购数量，默认0
      }));
      updateStats();
      renderList();
    } else {
      showEmpty('加载失败', '❌');
    }
  } catch (error) {
    console.error(error);
    showEmpty('网络错误，请重试', '📡');
  } finally {
    refreshBtn.classList.remove('loading');
    loadingOverlay.classList.add('hidden');
  }
}

function updateStats() {
  const pending = allItems.filter(i => i.status !== '已完成' && i.status !== '已采购').length;
  const done = allItems.filter(i => i.status === '已完成' || i.status === '已采购').length;
  document.getElementById('statPending').textContent = pending;
  document.getElementById('statDone').textContent = done;
}

// 渲染列表
function renderList() {
  let items = allItems;
  
  if (currentFilter === 'pending') {
    items = allItems.filter(i => i.status !== '已完成' && i.status !== '已采购');
  } else if (currentFilter === 'done') {
    items = allItems.filter(i => i.status === '已完成' || i.status === '已采购');
  }
  
  if (!items.length) {
    const messages = {
      'pending': '全部采购完成！🎉',
      'done': '还没有已采购的项目',
      'all': '还没有任何采购项目'
    };
    showEmpty(messages[currentFilter], '📋');
    return;
  }
  
  document.getElementById('list').innerHTML = items.map(item => {
    const isDone = item.status === '已完成' || item.status === '已采购';
    const statusClass = isDone ? 'done' : 'pending';
    const itemClass = isDone ? 'item done' : 'item';
    const icon = isDone ? '✓' : '';
    const purchased = parseInt(item.purchased) || 0;
    const total = parseInt(item.quantity) || 0;
    const progressPercent = total > 0 ? Math.min((purchased / total) * 100, 100) : 0;
    
    // 进度条（只在未完成且有已采购数量时显示）
    let progressHtml = '';
    if (!isDone && purchased > 0 && total > 0) {
      progressHtml = `
        <div class="item-progress">
          已采购 ${purchased}/${total} ${item.unit || ''}
          <div class="progress-bar">
            <div class="progress-fill" style="width: ${progressPercent}%"></div>
          </div>
        </div>
      `;
    }
    
    return `
      <div class="${itemClass}">
        <div class="checkbox ${statusClass}" onclick="toggleStatus('${item.id}', ${isDone})">${icon}</div>
        <div class="item-content">
          <div class="item-name">
            ${item.name || '-'}
            <span class="item-spec">${item.spec || ''}</span>
          </div>
          ${progressHtml}
        </div>
        <div class="item-qty-section">
          ${!isDone ? `<button class="item-purchased" onclick="openEditModal('${item.id}')">${purchased > 0 ? '已采' + purchased : '+采购'}</button>` : ''}
          <div class="item-total">${total} ${item.unit || ''}</div>
        </div>
      </div>
    `;
  }).join('');
}

function showEmpty(message, icon) {
  document.getElementById('list').innerHTML = `
    <div class="empty">
      <div class="empty-icon">${icon}</div>
      <p>${message}</p>
    </div>
  `;
}

// 切换状态：待采购 ↔ 已采购（只点击打勾区域）
async function toggleStatus(id, currentlyDone) {
  const newStatus = currentlyDone ? '待采购' : '已完成';
  
  // 先本地更新
  const item = allItems.find(i => String(i.id) === String(id));
  if (item) {
    item.status = newStatus;
    // 如果标记为完成，已采购数量设为总数量
    if (newStatus === '已完成') {
      item.purchased = item.quantity;
    }
    updateStats();
    renderList();
  }
  
  // 同步到服务器
  try {
    await fetch(`${API_URL}?action=update&id=${encodeURIComponent(id)}&status=${encodeURIComponent(newStatus)}&purchased=${item.purchased || 0}`);
  } catch (error) {
    console.error('更新失败:', error);
    loadData();
  }
}

// 打开编辑弹窗
function openEditModal(id) {
  editingItem = allItems.find(i => String(i.id) === String(id));
  if (!editingItem) return;
  
  document.getElementById('modalTitle').textContent = editingItem.name;
  document.getElementById('modalSubtitle').textContent = `需采购: ${editingItem.quantity} ${editingItem.unit || ''}`;
  document.getElementById('modalInput').value = editingItem.purchased || 0;
  document.getElementById('modalInput').max = editingItem.quantity;
  document.getElementById('editModal').classList.add('show');
  
  // 聚焦并选中输入框
  setTimeout(() => {
    const input = document.getElementById('modalInput');
    input.focus();
    input.select();
  }, 100);
}

// 关闭弹窗
function closeModal() {
  document.getElementById('editModal').classList.remove('show');
  editingItem = null;
}

// 点击弹窗外部关闭
document.getElementById('editModal').addEventListener('click', (e) => {
  if (e.target.id === 'editModal') closeModal();
});

// 确认编辑
async function confirmEdit() {
  if (!editingItem) return;
  
  const input = document.getElementById('modalInput');
  let purchased = parseInt(input.value) || 0;
  const total = parseInt(editingItem.quantity) || 0;
  
  // 限制范围
  if (purchased < 0) purchased = 0;
  if (purchased > total) purchased = total;
  
  // 更新本地数据
  editingItem.purchased = purchased;
  
  closeModal();
  renderList();
  
  // 同步到服务器
  try {
    await fetch(`${API_URL}?action=update&id=${encodeURIComponent(editingItem.id)}&purchased=${purchased}`);
  } catch (error) {
    console.error('更新失败:', error);
  }
}

// 初始加载
loadData();

// 每60秒自动刷新
setInterval(loadData, 60000);
</script>
</body>
</html>
