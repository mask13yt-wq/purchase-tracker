<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>采购待办</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      background: #f5f5f5; 
      min-height: 100vh;
      padding-bottom: 80px;
    }
    
    .stats { 
      display: flex; 
      justify-content: center;
      gap: 30px;
      padding: 12px 15px; 
      background: white; 
      border-bottom: 1px solid #eee;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .stat { text-align: center; }
    .stat-num { font-size: 22px; font-weight: 700; }
    .stat-num.pending { color: #ea4335; }
    .stat-num.done { color: #34a853; }
    .stat-num.need-form { color: #ff9800; }
    .stat-label { font-size: 11px; color: #888; }
    
    .tabs { 
      display: flex; 
      padding: 8px 10px; 
      gap: 6px; 
      background: #f5f5f5;
      position: sticky;
      top: 52px;
      z-index: 99;
    }
    .tab { 
      flex: 1; 
      padding: 8px 6px; 
      border: none; 
      border-radius: 20px; 
      background: white; 
      cursor: pointer; 
      font-size: 13px;
      font-weight: 500;
      color: #666;
    }
    .tab.active { background: #4285f4; color: white; }
    .tab.need-form.active { background: #ff9800; }
    
    .list { padding: 0 10px; }
    
    /* 批次分组 */
    .batch-group {
      margin: 10px 0;
      border-radius: 12px;
      overflow: hidden;
    }
    .batch-group.color-0 { border: 2px solid #bbdefb; background: #e3f2fd; }
    .batch-group.color-1 { border: 2px solid #c8e6c9; background: #e8f5e9; }
    .batch-group.color-2 { border: 2px solid #ffe0b2; background: #fff3e0; }
    .batch-group.color-3 { border: 2px solid #e1bee7; background: #f3e5f5; }
    .batch-group.color-4 { border: 2px solid #ffccbc; background: #fbe9e7; }
    .batch-group.color-5 { border: 2px solid #b2dfdb; background: #e0f2f1; }
    
    .batch-header {
      padding: 6px 12px;
      font-size: 11px;
      color: #666;
      display: flex;
      justify-content: space-between;
    }
    
    .item { 
      background: white; 
      margin: 4px 8px;
      padding: 10px 12px; 
      border-radius: 8px; 
      display: flex; 
      align-items: center; 
      gap: 10px;
    }
    .item:last-child { margin-bottom: 8px; }
    .item.manual { border-left: 3px solid #ff9800; }
    
    .checkbox { 
      width: 26px; 
      height: 26px; 
      border: 2px solid #ddd; 
      border-radius: 50%; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 14px; 
      flex-shrink: 0;
      cursor: pointer;
    }
    .checkbox:active { transform: scale(0.9); }
    .checkbox.pending { border-color: #ea4335; }
    .checkbox.done { border-color: #34a853; background: #34a853; color: white; }
    
    .item-content { flex: 1; min-width: 0; }
    .item-name { 
      font-size: 14px; 
      color: #333;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
    }
    .item-spec { color: #999; margin-left: 4px; }
    .item.done .item-name { color: #bbb; text-decoration: line-through; }
    
    /* 仓库标签 */
    .warehouse-tag {
      font-size: 9px;
      padding: 2px 5px;
      border-radius: 8px;
      color: white;
      flex-shrink: 0;
    }
    .warehouse-tag.sgb { background: #1565c0; }
    .warehouse-tag.lgk { background: #c62828; }
    .warehouse-tag.other { background: #757575; }
    
    .item-tag {
      font-size: 10px;
      color: #ff9800;
      background: #fff3e0;
      padding: 2px 6px;
      border-radius: 8px;
      margin-top: 3px;
      display: inline-block;
    }
    
    .item-progress {
      font-size: 11px;
      color: #888;
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .progress-bar {
      flex: 1;
      height: 3px;
      background: #eee;
      border-radius: 2px;
      overflow: hidden;
      max-width: 80px;
    }
    .progress-fill { height: 100%; background: #34a853; }
    
    .item-qty-section {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    
    .item-total { 
      background: #f0f0f0; 
      color: #666; 
      padding: 4px 8px; 
      border-radius: 12px; 
      font-size: 12px; 
    }
    .item.done .item-total { color: #bbb; }
    
    .item-purchased {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 12px;
      cursor: pointer;
      border: none;
    }
    
    /* 已补按钮 */
    .item-filled-btn {
      background: #fff3e0;
      color: #ff9800;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid #ff9800;
    }
    .item-filled-btn.filled {
      background: #ff9800;
      color: white;
    }
    
    .empty { text-align: center; padding: 40px 20px; color: #999; }
    .empty-icon { font-size: 40px; margin-bottom: 10px; }
    
    .add-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #4285f4;
      color: white;
      border: none;
      font-size: 28px;
      box-shadow: 0 4px 15px rgba(66,133,244,0.4);
      cursor: pointer;
    }
    
    .loading-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }
    .loading-overlay.hidden { display: none; }
    .loading-spinner { font-size: 30px; animation: spin 1s linear infinite; }
    
    @keyframes spin { to { transform: rotate(360deg); } }
    
    /* 弹窗 */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
      z-index: 300;
    }
    .modal.show { display: flex; }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 14px;
      width: 300px;
    }
    .modal-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 15px;
      text-align: center;
    }
    .modal-input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 14px;
      outline: none;
    }
    .modal-input:focus { border-color: #4285f4; }
    .modal-row { display: flex; gap: 10px; }
    .modal-row .modal-input { flex: 1; }
    .modal-buttons { display: flex; gap: 10px; margin-top: 15px; }
    .modal-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
    }
    .modal-btn.cancel { background: #f0f0f0; color: #666; }
    .modal-btn.confirm { background: #4285f4; color: white; }
    
    /* 仓库选择 */
    .warehouse-options {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }
    .wh-btn {
      flex: 1;
      padding: 10px 6px;
      border: 2px solid #ddd;
      border-radius: 8px;
      background: white;
      font-size: 12px;
      cursor: pointer;
    }
    .wh-btn.selected { color: white; }
    .wh-btn.sgb.selected { background: #1565c0; border-color: #1565c0; }
    .wh-btn.lgk.selected { background: #c62828; border-color: #c62828; }
    .wh-btn.other.selected { background: #757575; border-color: #757575; }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner">🔄</div>
  </div>
  
  <div class="stats">
    <div class="stat">
      <div class="stat-num pending" id="statPending">-</div>
      <div class="stat-label">待采购</div>
    </div>
    <div class="stat">
      <div class="stat-num done" id="statDone">-</div>
      <div class="stat-label">已采购</div>
    </div>
    <div class="stat">
      <div class="stat-num need-form" id="statNeedForm">-</div>
      <div class="stat-label">需补单</div>
    </div>
  </div>
  
  <div class="tabs">
    <button class="tab active" data-filter="pending">待采购</button>
    <button class="tab need-form" data-filter="needForm">需补单</button>
    <button class="tab" data-filter="all">全部</button>
  </div>
  
  <div class="list" id="list"></div>
  
  <button class="add-btn" onclick="openAddModal()">+</button>

  <!-- 编辑已采购数量弹窗 -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <div class="modal-title" id="editModalTitle">编辑已采购</div>
      <div style="text-align:center; color:#888; font-size:13px; margin-bottom:15px;" id="editModalSubtitle"></div>
      <input type="number" class="modal-input" id="editModalInput" min="0" style="font-size:20px; text-align:center;">
      <div class="modal-buttons">
        <button class="modal-btn cancel" onclick="closeEditModal()">取消</button>
        <button class="modal-btn confirm" onclick="confirmEdit()">确认</button>
      </div>
    </div>
  </div>

  <!-- 添加采购项弹窗 -->
  <div class="modal" id="addModal">
    <div class="modal-content">
      <div class="modal-title">➕ 添加采购项（需补单）</div>
      <div class="warehouse-options">
        <button class="wh-btn sgb" onclick="selectAddWarehouse('石膏板库', this)">石膏板库</button>
        <button class="wh-btn lgk" onclick="selectAddWarehouse('龙骨库', this)">龙骨库</button>
        <button class="wh-btn other" onclick="selectAddWarehouse('其他', this)">其他</button>
      </div>
      <input type="text" class="modal-input" id="addName" placeholder="材料名称 *">
      <input type="text" class="modal-input" id="addSpec" placeholder="规格/型号（可选）">
      <div class="modal-row">
        <input type="number" class="modal-input" id="addQuantity" placeholder="数量 *" min="1">
        <input type="text" class="modal-input" id="addUnit" placeholder="单位" style="max-width:80px;">
      </div>
      <div style="background:#fff3e0; color:#ff9800; padding:8px; border-radius:6px; font-size:12px; text-align:center;">
        ⚠️ 此项需要补采购申请单
      </div>
      <div class="modal-buttons">
        <button class="modal-btn cancel" onclick="closeAddModal()">取消</button>
        <button class="modal-btn confirm" onclick="confirmAdd()">添加</button>
      </div>
    </div>
  </div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyRFRZMllCzz1Vl9BCf2_1FGcbPMz0KjWSoyZhBu6fOxmseiQku39Uh64v41t_7rWbtww/exec';

let allItems = [];
let currentFilter = 'pending';
let editingItem = null;
let addWarehouse = '';

const BATCH_COLORS = 6;

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentFilter = tab.dataset.filter;
    renderList();
  });
});

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') loadData(); });
window.addEventListener('focus', () => loadData());

async function loadData() {
  try {
    const response = await fetch(`${API_URL}?action=list`);
    const result = await response.json();
    if (result.success) {
      allItems = (result.items || []).map(item => ({
        ...item,
        purchased: item.purchased || 0
      }));
      updateStats();
      renderList();
    }
  } catch (error) {
    console.error(error);
  } finally {
    document.getElementById('loadingOverlay').classList.add('hidden');
  }
}

function updateStats() {
  const pending = allItems.filter(i => i.status !== '已完成' && i.status !== '已采购' && !isNeedForm(i)).length;
  const done = allItems.filter(i => i.status === '已完成' || i.status === '已采购').length;
  const needForm = allItems.filter(i => isNeedForm(i) && i.status !== '已完成' && i.status !== '已采购').length;
  document.getElementById('statPending').textContent = pending;
  document.getElementById('statDone').textContent = done;
  document.getElementById('statNeedForm').textContent = needForm;
}

function isNeedForm(item) {
  return item.remark && item.remark.includes('需补采购申请');
}

function isFormFilled(item) {
  return item.remark && item.remark.includes('已补');
}

function renderList() {
  let items = allItems;
  
  if (currentFilter === 'pending') {
    items = allItems.filter(i => i.status !== '已完成' && i.status !== '已采购');
  } else if (currentFilter === 'needForm') {
    items = allItems.filter(i => isNeedForm(i) && i.status !== '已完成' && i.status !== '已采购');
  }
  
  if (!items.length) {
    const messages = { 
      'pending': '全部采购完成！🎉', 
      'needForm': '没有需要补单的项目',
      'all': '还没有任何采购项目' 
    };
    document.getElementById('list').innerHTML = `<div class="empty"><div class="empty-icon">📋</div><p>${messages[currentFilter]}</p></div>`;
    return;
  }
  
  // 如果是"需补单"页面，不按批次分组
  if (currentFilter === 'needForm') {
    document.getElementById('list').innerHTML = items.map(item => renderItem(item, true)).join('');
    return;
  }
  
  // 按批次分组
  const batches = {};
  const batchOrder = [];
  items.forEach(item => {
    const bid = item.batchId || 'default';
    if (!batches[bid]) {
      batches[bid] = [];
      batchOrder.push(bid);
    }
    batches[bid].push(item);
  });
  
  let html = '';
  batchOrder.forEach((bid, idx) => {
    const colorIdx = idx % BATCH_COLORS;
    const batchItems = batches[bid];
    const batchDate = batchItems[0]?.date ? new Date(batchItems[0].date).toLocaleDateString() : '';
    
    html += `<div class="batch-group color-${colorIdx}">`;
    html += `<div class="batch-header"><span>📦 批次 ${idx + 1}</span><span>${batchDate}</span></div>`;
    
    batchItems.forEach(item => {
      html += renderItem(item, false);
    });
    
    html += `</div>`;
  });
  
  document.getElementById('list').innerHTML = html;
}

function renderItem(item, showFilledBtn) {
  const isDone = item.status === '已完成' || item.status === '已采购';
  const statusClass = isDone ? 'done' : 'pending';
  const isManual = isNeedForm(item);
  const itemClass = isDone ? 'item done' : (isManual ? 'item manual' : 'item');
  const icon = isDone ? '✓' : '';
  const purchased = parseInt(item.purchased) || 0;
  const total = parseInt(item.quantity) || 0;
  const percent = total > 0 ? Math.min((purchased / total) * 100, 100) : 0;
  
  // 仓库标签
  const wh = item.warehouse || '';
  const whClass = wh === '石膏板库' ? 'sgb' : wh === '龙骨库' ? 'lgk' : 'other';
  const whTag = wh ? `<span class="warehouse-tag ${whClass}">${wh.replace('库','')}</span>` : '';
  
  let progressHtml = '';
  if (!isDone && purchased > 0 && total > 0) {
    progressHtml = `<div class="item-progress">${purchased}/${total}<div class="progress-bar"><div class="progress-fill" style="width:${percent}%"></div></div></div>`;
  }
  
  // 需补单标签
  let tagHtml = '';
  if (isManual && !isDone && !showFilledBtn) {
    tagHtml = `<div class="item-tag">需补单</div>`;
  }
  
  // 已补按钮（只在需补单页面显示）
  let filledBtnHtml = '';
  if (showFilledBtn && isManual) {
    const filled = isFormFilled(item);
    filledBtnHtml = `<button class="item-filled-btn ${filled ? 'filled' : ''}" onclick="toggleFilled('${item.id}', ${filled})">${filled ? '已补' : '未补'}</button>`;
  }
  
  return `
    <div class="${itemClass}">
      <div class="checkbox ${statusClass}" onclick="toggleStatus('${item.id}', ${isDone})">${icon}</div>
      <div class="item-content">
        <div class="item-name">
          ${whTag}
          ${item.name || '-'}
          <span class="item-spec">${item.spec || ''}</span>
        </div>
        ${tagHtml}
        ${progressHtml}
      </div>
      <div class="item-qty-section">
        <div class="item-total">${total}${item.unit || ''}</div>
        ${!isDone && !showFilledBtn ? `<button class="item-purchased" onclick="openEditModal('${item.id}')">${purchased > 0 ? purchased + '已采' : '+采购'}</button>` : ''}
        ${filledBtnHtml}
      </div>
    </div>
  `;
}

async function toggleStatus(id, currentlyDone) {
  const newStatus = currentlyDone ? '待采购' : '已完成';
  const item = allItems.find(i => String(i.id) === String(id));
  if (item) {
    item.status = newStatus;
    if (newStatus === '已完成') item.purchased = item.quantity;
    updateStats();
    renderList();
  }
  try {
    await fetch(`${API_URL}?action=update&id=${encodeURIComponent(id)}&status=${encodeURIComponent(newStatus)}&purchased=${item?.purchased || 0}`);
  } catch (e) { loadData(); }
}

async function toggleFilled(id, currentlyFilled) {
  const item = allItems.find(i => String(i.id) === String(id));
  if (!item) return;
  
  let newRemark = item.remark || '';
  if (currentlyFilled) {
    // 取消已补
    newRemark = newRemark.replace('已补', '').trim();
  } else {
    // 标记已补
    if (!newRemark.includes('已补')) {
      newRemark = newRemark + ' 已补';
    }
  }
  
  item.remark = newRemark;
  renderList();
  
  try {
    await fetch(`${API_URL}?action=update&id=${encodeURIComponent(id)}&remark=${encodeURIComponent(newRemark)}`);
  } catch (e) { loadData(); }
}

function openEditModal(id) {
  editingItem = allItems.find(i => String(i.id) === String(id));
  if (!editingItem) return;
  document.getElementById('editModalTitle').textContent = editingItem.name;
  document.getElementById('editModalSubtitle').textContent = `需采购: ${editingItem.quantity} ${editingItem.unit || ''}`;
  document.getElementById('editModalInput').value = editingItem.purchased || 0;
  document.getElementById('editModal').classList.add('show');
  setTimeout(() => { document.getElementById('editModalInput').focus(); document.getElementById('editModalInput').select(); }, 100);
}

function closeEditModal() { document.getElementById('editModal').classList.remove('show'); editingItem = null; }
document.getElementById('editModal').addEventListener('click', (e) => { if (e.target.id === 'editModal') closeEditModal(); });

async function confirmEdit() {
  if (!editingItem) return;
  let purchased = parseInt(document.getElementById('editModalInput').value) || 0;
  const total = parseInt(editingItem.quantity) || 0;
  if (purchased < 0) purchased = 0;
  if (purchased > total) purchased = total;
  editingItem.purchased = purchased;
  closeEditModal();
  renderList();
  try { await fetch(`${API_URL}?action=update&id=${encodeURIComponent(editingItem.id)}&purchased=${purchased}`); } catch (e) {}
}

// 添加弹窗
function selectAddWarehouse(wh, btn) {
  addWarehouse = wh;
  document.querySelectorAll('.wh-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

function openAddModal() {
  addWarehouse = '';
  document.querySelectorAll('.wh-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('addName').value = '';
  document.getElementById('addSpec').value = '';
  document.getElementById('addQuantity').value = '';
  document.getElementById('addUnit').value = '';
  document.getElementById('addModal').classList.add('show');
  setTimeout(() => { document.getElementById('addName').focus(); }, 100);
}

function closeAddModal() { document.getElementById('addModal').classList.remove('show'); }
document.getElementById('addModal').addEventListener('click', (e) => { if (e.target.id === 'addModal') closeAddModal(); });

async function confirmAdd() {
  const name = document.getElementById('addName').value.trim();
  const spec = document.getElementById('addSpec').value.trim();
  const quantity = document.getElementById('addQuantity').value.trim();
  const unit = document.getElementById('addUnit').value.trim();
  
  if (!addWarehouse) { alert('请选择仓库'); return; }
  if (!name) { alert('请输入名称'); return; }
  if (!quantity) { alert('请输入数量'); return; }
  
  closeAddModal();
  document.getElementById('loadingOverlay').classList.remove('hidden');
  
  const batchId = 'B' + Date.now();
  
  try {
    await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        items: [{
          name: name,
          spec: spec,
          quantity: quantity,
          unit: unit,
          warehouse: addWarehouse,
          remark: '需补采购申请',
          batchId: batchId
        }]
      })
    });
    await loadData();
  } catch (e) {
    alert('添加失败');
    document.getElementById('loadingOverlay').classList.add('hidden');
  }
}

loadData();
setInterval(loadData, 30000);
</script>
</body>
</html>
